<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free Fire Tournament</title>

<style>
*{
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body, html{
  height:100%;
  overflow:hidden;
}

/* Background video */
video{
  position:fixed;
  right:0;
  bottom:0;
  min-width:100%;
  min-height:100%;
  z-index:-1;
  object-fit:cover;
}

/* Dark overlay */
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:0;
}

/* Form box */
.container{
  position:relative;
  z-index:1;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.form-box{
  background:rgba(20,20,20,0.85);
  padding:25px;
  border-radius:15px;
  width:300px;
  text-align:center;
  color:white;
  box-shadow:0 0 20px #00ff88;
}

h2{
  margin-bottom:15px;
  color:#00ff88;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#25D366;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 10px #25D366;
}

button:hover{
  transform:scale(1.05);
}
</style>

</head>

<body>

<!-- 🔴 Free Fire gameplay video (replace link if needed) -->
<video autoplay muted loop>
  <source src="https://cdn.coverr.co/videos/coverr-battle-royale-gameplay-4146/1080p.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
  <div class="form-box">
    <h2>Free Fire Tournament</h2>

    <input type="text" id="name" placeholder="Enter Your Name">
    <input type="text" id="uid" placeholder="Enter Your UID">

    <button onclick="sendWhatsApp()">Register on WhatsApp</button>
  </div>
</div>

<script>
function sendWhatsApp(){
  let name = document.getElementById("name").value;
  let uid = document.getElementById("uid").value;

  if(name === "" || uid === ""){
    alert("Please fill all fields");
    return;
  }

  let number = "923409909351";
  let message = 
  "🔥 Free Fire Tournament Registration\n\n" +
  "Name: " + name + "\n" +
  "UID: " + uid;

  let url = "https://wa.me/" + number + "?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}
</script>

</body>
</html>
